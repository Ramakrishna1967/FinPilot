services:
  - type: web
    name: finpilot-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TICK_SECONDS
        value: "3.5"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Set GROQ_API_KEY in the Render dashboard (Environment tab) — never commit it.
